
<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>مختبر الشبكات</title>
</head>
<body>
<h2>🔬 مختبر الشبكات</h2>
<p>تجربة تعليمية لمعرفة المنطقة التقريبية لاتصالك من عنوان IP.</p>
<p>عند الضغط على الزر، سيُرسل طلب إلى خدمة خارجية لمعرفة معلومات اتصالك.</p>
<button onclick="checkIP()">اختبر اتصالي</button>
<pre id="result"></pre>
<script>
async function checkIP() {
  const out = document.getElementById("result");
  out.textContent = "جارٍ الاختبار...";
  try {
    const r = await fetch("https://ipwho.is/");
    const d = await r.json();
    out.textContent = d.success
      ? "الدولة: " + d.country +
        "\nالولاية/المنطقة المقدّرة: " + d.region +
        "\nالمدينة المقدّرة: " + d.city
      : "تعذر تحديد المنطقة.";
  } catch (e) {
    out.textContent = "تعذر الاتصال بالخدمة.";
  }
}
</script>
</body>
</html>
